name: Build Android and Upload to SFTP

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  generate-version:
    runs-on: ubuntu-latest
    outputs:
      version_name: ${{ steps.version.outputs.VERSION_NAME }}
      version_code: ${{ steps.version.outputs.VERSION_CODE }}
      build_type: ${{ steps.version.outputs.BUILD_TYPE }}
      build_tag: ${{ steps.version.outputs.BUILD_TAG }}
      build_datetime: ${{ steps.version.outputs.BUILD_DATETIME }}
      build_timezone: ${{ steps.version.outputs.BUILD_TIMEZONE }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate version
        id: version
        run: |
          chmod +x scripts/generate_version.sh
          source <(bash scripts/generate_version.sh | while IFS='=' read -r key val; do echo "$key=$val"; done)
          echo "VERSION_NAME=${VERSION_NAME}" >> $GITHUB_OUTPUT
          echo "VERSION_CODE=${VERSION_CODE}" >> $GITHUB_OUTPUT
          echo "BUILD_TYPE=${BUILD_TYPE}" >> $GITHUB_OUTPUT
          echo "BUILD_TAG=${BUILD_TAG}" >> $GITHUB_OUTPUT
          echo "BUILD_DATETIME=${BUILD_DATETIME}" >> $GITHUB_OUTPUT
          echo "BUILD_TIMEZONE=${BUILD_TIMEZONE}" >> $GITHUB_OUTPUT
          echo "--- Version Info ---"
          echo "Version Name : ${VERSION_NAME}"
          echo "Version Code : ${VERSION_CODE}"
          echo "Build Type   : ${BUILD_TYPE}"
          echo "Build Tag    : ${BUILD_TAG}"
          echo "Build Time   : ${BUILD_DATETIME} ${BUILD_TIMEZONE}"

  build-and-upload:
    needs: generate-version
    runs-on: ubuntu-latest
    if: github.repository == 'weijia/immich'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.1'
          channel: 'stable'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'

      - name: Restore Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.android/sdk
          key: gradle-${{ runner.os }}-${{ hashFiles('mobile/android/**/*.gradle*', 'mobile/android/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Create Keystore
        run: |
          mkdir -p mobile/android
          echo "${{ secrets.KEY_JKS }}" | base64 -d > mobile/android/key.jks

      - name: Install Flutter dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Generate translations
        working-directory: mobile
        run: |
          dart run easy_localization:generate -S ../i18n
          dart format lib/generated/codegen_loader.g.dart
          dart run bin/generate_keys.dart
          dart format lib/generated/translations.g.dart

      - name: Generate platform APIs
        working-directory: mobile
        run: |
          ls pigeon/*.dart | xargs -n1 -P4 -I{} dart run pigeon --input {}
          dart format lib/platform/

      - name: Build Android APK
        working-directory: mobile
        env:
          ALIAS: ${{ secrets.ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEYSTORE_PATH: ../android/key.jks
        run: |
          flutter build apk --release \
            --build-name=${{ needs.generate-version.outputs.version_name }} \
            --build-number=${{ needs.generate-version.outputs.version_code }}

      - name: Prepare upload directory
        run: |
          mkdir -p upload
          # 使用版本号作为文件名
          VERSION="${{ needs.generate-version.outputs.version_name }}"
          cp mobile/build/app/outputs/flutter-apk/app-release.apk "upload/immich-${VERSION}.apk"
          echo "--- Upload Files ---"
          ls -la upload/

      - name: Upload APK to SFTP
        uses: weijia/action-upload-sftp@master
        with:
          sftp-host: ${{ secrets.SFTP_HOST }}
          sftp-port: ${{ secrets.SFTP_PORT }}
          sftp-username: ${{ secrets.SFTP_USERNAME }}
          sftp-password: ${{ secrets.SFTP_PASSWORD }}
          source-path: ./upload/
          remote-path: /home/github/apps/immich/
          cleanup-old-files: 'true'
          max-keep-files: 10

  build-summary:
    needs: [generate-version, build-and-upload]
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Build Summary
        run: |
          echo "## Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Item | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Version Name | \`${{ needs.generate-version.outputs.version_name }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Version Code | \`${{ needs.generate-version.outputs.version_code }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Build Type | \`${{ needs.generate-version.outputs.build_type }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Git Tag | \`${{ needs.generate-version.outputs.build_tag }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Build Time | \`${{ needs.generate-version.outputs.build_datetime }}\` \`${{ needs.generate-version.outputs.build_timezone }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Branch | \`${{ github.ref_name }}\` |" >> $GITHUB_STEP_SUMMARY
